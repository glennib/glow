# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: dist

on:
  workflow_call:
    inputs:
      version:
        description: Version to embed and use in archive names, e.g. v1.2.3. Empty builds a snapshot.
        required: false
        type: string
        default: ""
      retention-days:
        description: How long to keep the uploaded archives.
        required: false
        type: number
        default: 7

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and package
        run: bash .github/scripts/dist.sh "$GOOS_TARGET" "$GOARCH_TARGET" "$VERSION"
        env:
          GOOS_TARGET: ${{ matrix.goos }}
          GOARCH_TARGET: ${{ matrix.goarch }}
          VERSION: ${{ inputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
